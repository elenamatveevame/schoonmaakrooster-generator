<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schoonmaakrooster generator</title>
<style>
/* Offline staff tool: one file, no internet, no installation. Data stays in this browser and in back-up files. */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --ink:#16211D; --muted:#5B6963; --line:#D8E0DA; --tint:#E8EEEA;
  --accent:#0E6A58; --accent-ink:#FFFFFF; --head:#2D5597; --head-ink:#FFFFFF;
  --mark:#FBE38A; --mark-ink:#3A2E00; --warn:#B3402A; --warn-bg:#FBE8E3; --alert:#9A5B00; --alert-bg:#FFF1D6; --ok:#1F7A45; --ok-bg:#E2F3E8;
  --f-body:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --f-code:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
[hidden]{display:none!important}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:16px 64px;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
h1{font-size:1.5rem;margin:0}
h2{font-size:1.15rem;margin:0}
h3{font-size:1rem;margin:0}
p{margin:0}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .small{font-size:.85rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:500;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;font-size:.9rem;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{border-color:transparent;background:none;text-decoration:underline;padding-inline:4px}
.btn.danger{color:var(--warn)}
.btn:disabled{opacity:.5;cursor:default}
select,input[type=text],input[type=date],input[type=month],textarea{border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:var(--surface)}
.code{font-family:var(--f-code);font-size:.86em;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:600;border-radius:999px;padding:1px 8px;white-space:nowrap}
.chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.alert{background:var(--alert-bg);color:var(--alert)} .chip.neutral{background:var(--tint);color:var(--muted)}
.chip button{border:0;background:none;padding:0;color:inherit;font-weight:700}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:980px){.layout{grid-template-columns:minmax(0,1fr)}}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.rota{border-collapse:collapse;width:100%;min-width:820px;font-size:.85rem}
.rota th,.rota td{padding:5px 6px;border-bottom:1px solid var(--line);border-inline-end:1px solid var(--line);text-align:center;vertical-align:top}
.rota thead th{background:var(--head);color:var(--head-ink);font-weight:600;position:sticky;top:0}
.rota tbody th{text-align:start;white-space:nowrap;font-weight:600}
.rota tbody th .w{font-weight:400;color:var(--muted);margin-inline-start:4px}
.rota tr.we{background:var(--tint)}
.rota tr.past{opacity:.5}
.slot{display:inline-block;border:1px solid transparent;background:none;border-radius:4px;padding:1px 4px;font-family:var(--f-code);font-size:.82rem;white-space:nowrap}
button.slot:hover{border-color:var(--accent)}
.slot.sel{background:var(--accent);color:var(--accent-ink)}
.slot.bad{background:var(--warn-bg);color:var(--warn);font-weight:700}
.slot.dup{background:var(--alert-bg);color:var(--alert);font-weight:700}
.slot.chg{text-decoration:underline dotted;text-underline-offset:3px}
.slot.empty{color:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.8rem;color:var(--muted);align-items:center}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--bg)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:560px){.stats{grid-template-columns:minmax(0,1fr)}}
.stat{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface)}
.stat .n{font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums}
.stat.good .n{color:var(--ok)} .stat.bad .n{color:var(--warn)}
table.edit{border-collapse:collapse;width:100%;min-width:760px;font-size:.88rem}
table.edit th{text-align:start;font-size:.78rem;color:var(--muted);padding:4px 6px}
table.edit td{padding:4px 6px;vertical-align:middle;border-top:1px solid var(--line)}
table.edit input[type=text]{width:100%}
table.edit input.short{width:6rem}
.days{display:inline-flex;gap:3px;flex-wrap:wrap}
.days button{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:2px 6px;font-size:.78rem;min-width:2.1rem}
.days button[aria-pressed="true"]{background:var(--warn-bg);border-color:var(--warn);color:var(--warn);font-weight:700;text-decoration:line-through}
ul.plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.notice{border-radius:8px;padding:10px 14px;background:var(--alert-bg);color:var(--alert)}
.confirm{border:1px solid var(--warn);background:var(--warn-bg);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
textarea{width:100%;font-family:var(--f-code);font-size:.85rem}
.toast{position:fixed;inset-inline:16px;bottom:16px;margin-inline:auto;max-width:440px;background:var(--ink);color:var(--bg);border-radius:8px;padding:10px 14px;text-align:center;font-weight:500}
#print{display:none}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff}
  .wrap,.toast{display:none!important}
  #print{display:block}
  #print h1{font-size:18pt;color:#2D5597;text-align:center;margin:0}
  #print p{text-align:center;font-style:italic;margin:2pt 0 8pt}
  #print table{border-collapse:collapse;width:100%;font-size:9pt}
  #print th,#print td{border:1px solid #999;padding:3pt 4pt;text-align:center}
  #print thead th{background:#2D5597;color:#fff}
  #print tbody th{text-align:left}
}
</style>
</head>

<div id="print"></div>

function issuesOf(k,mon){
 const out={bad:new Set(),dup:new Set()};const L=lay(mon.cols);
 Object.keys(mon.days).forEach(dk=>{const d=+dk,row=mon.days[d],seen={};
  row.forEach((u,s)=>{if(!u)return;if(cantOn(u,k,d))out.bad.add(d+"-"+s);(seen[u]=seen[u]||[]).push(s);});
  Object.values(seen).forEach(ss=>{if(ss.length>1)ss.forEach(s=>out.dup.add(d+"-"+s));});});
 return out;
}
function rotaTable(k,mon,opts={}){
 const L=lay(mon.cols), iss=issuesOf(k,mon), chg=new Set(mon.changed||[]);
 const one=(d,s)=>{const u=mon.days[d][s]||"";const id=d+"-"+s;
  const cls=["slot",iss.bad.has(id)?"bad":"",iss.dup.has(id)?"dup":"",chg.has(id)?"chg":"",!u?"empty":"",U.sel&&U.sel.d===d&&U.sel.s===s?"sel":""].join(" ");
  return opts.static?`<span class="${cls}">${esc(u||"—")}</span>`:`<button class="${cls}" data-act="pick" data-d="${d}" data-s="${s}">${esc(u||"—")}</button>`;};
 let h=`<div class="tablewrap"><table class="rota"><thead><tr><th>${esc(t("date"))}</th>${mon.cols.map(c=>`<th>${esc(label(c))}</th>`).join("")}</tr></thead><tbody>`;
 Object.keys(mon.days).map(Number).sort((a,b)=>a-b).forEach(d=>{const w=wdOf(k,d);
  h+=`<tr class="${w>=5?"we":""} ${!opts.static&&isPast(k,d)?"past":""}"><th>${d} ${esc(MS[S.lang][ym(k).m])}<span class="w">${esc(WD[S.lang][w])}</span></th>${mon.cols.map((c,i)=>{const parts=[];for(let j=0;j<c.n;j++)parts.push(one(d,L.st[i]+j));return `<td>${parts.join(" + ")}</td>`;}).join("")}</tr>`;});
 return h+"</tbody></table></div>";
}

/* ---------- view: schedule ---------- */
function swapOptions(k,mon,d,s){
 const L=lay(mon.cols), a=mon.days[d][s], colA=mon.cols[L.sc[s]], poolA=poolFor(colA), out=[];
 Object.keys(mon.days).map(Number).forEach(d2=>{if(d2===d||isPast(k,d2))return;
  mon.days[d2].forEach((b,s2)=>{if(!b||b===a)return;const colB=mon.cols[L.sc[s2]];
   if(!poolA.includes(b)||!poolFor(colB).includes(a))return;
   if(mon.days[d].includes(b)||mon.days[d2].includes(a))return;
   if(cantOn(b,k,d)||cantOn(a,k,d2))return;
   out.push({d2,s2,b,same:L.sc[s2]===L.sc[s]});});});
 return out.sort((x,y)=>(y.same-x.same)||(Math.abs(x.d2-d)-Math.abs(y.d2-d))).slice(0,15);
}

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let x=Math.imul(seed^seed>>>15,1|seed);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296;};}
function defaultNewKey(){const keys=Object.keys(F().months).sort();const tk=todayKey();const base=keys.length&&keys[keys.length-1]>tk?keys[keys.length-1]:tk;const {y,m}=ym(base);return m===11?keyOf(y+1,0):keyOf(y,m+1);}
function generate(k){
 const {y,m}=ym(k), n=dim(y,m), r=rng(U.seed*7919), f=F(), all=f.rooms.map(x=>x.u), load={}, tl={}, last={};
 const cols=f.places.map(p=>({nl:p.nl,en:p.en||p.nl,n:+p.n||1}));
 const slotTask=[],pools=[];
 f.places.forEach((p,i)=>{const pool=(!p.g||p.g==="alle")?all:f.rooms.filter(x=>x.g===p.g).map(x=>x.u);for(let j=0;j<(+p.n||1);j++){slotTask.push(i);pools.push(pool);}});
 all.forEach(u=>{load[u]=0;tl[u]=cols.map(()=>0);last[u]=-9;});
 const order=slotTask.map((_,s)=>s).sort((a,b)=>pools[a].length-pools[b].length);
 const days={};
 for(let d=1;d<=n;d++){const row=slotTask.map(()=>""),used=new Set();
  for(const s of order){const cands=pools[s].filter(u=>!used.has(u)&&!cantOn(u,k,d));let best=null,bs=1e9;
   for(const u of cands){const sc=load[u]*10+tl[u][slotTask[s]]*4+(last[u]===d-1?25:0)+r()*3;if(sc<bs){bs=sc;best=u;}}
   row[s]=best||"";if(best){used.add(best);load[best]++;tl[best][slotTask[s]]++;}}
  used.forEach(u=>last[u]=d);days[d]=row;}
 let conf=0,inrow=0,empty=0;
 for(let d=1;d<=n;d++){days[d].forEach(u=>{if(!u)empty++;else if(cantOn(u,k,d))conf++;});if(d>1)new Set(days[d].filter(Boolean)).forEach(u=>{if(days[d-1].includes(u))inrow++;});}
 const vals=Object.values(load);
 U.gen={k,mon:{cols,days,changed:[]},load,conf,inrow,empty,min:vals.length?Math.min(...vals):0,max:vals.length?Math.max(...vals):0};
}

}
function exExcel(k,mon){
 const q=v=>/[;"\n]/.test(v)?`"${String(v).replace(/"/g,'""')}"`:v;
 const lines=[[t("date")].concat(mon.cols.map(label))].concat(exportRows(k,mon)).map(r=>r.map(q).join(";"));
 download(fileBase(k)+".csv","text/csv;charset=utf-8","﻿"+lines.join("\r\n"));
}
function exPrint(k,mon){document.getElementById("print").innerHTML=`<h1>${esc(t("wordTitle",{floor:S.floor}))}</h1><p>${esc(monthName(k))}</p>${tableHtml(k,mon)}`;window.print();}
function waText(k,mon){const L=lay(mon.cols),out=[`*${t("wordTitle",{floor:S.floor})}, ${monthName(k)}*`,""];
 Object.keys(mon.days).map(Number).sort((a,b)=>a-b).forEach(d=>{out.push(`*${fmt(k,d)}*`);mon.cols.forEach((c,i)=>out.push(`${label(c)}: ${mon.days[d].slice(L.st[i],L.st[i]+c.n).filter(Boolean).join(" + ")}`));out.push("");});return out.join("\n");}
function copyText(txt){const ta=document.getElementById("watext");const fb=()=>{if(ta){ta.value=txt;ta.hidden=false;ta.focus();ta.select();}toast(t("copyFail"));};
 try{navigator.clipboard.writeText(txt).then(()=>toast(t("copied")),fb);}catch(e){fb();}}

/* ---------- render + events ---------- */
function render(){
 document.documentElement.lang=S.lang;
 if(!S.floors[S.floor])S.floor=Object.keys(S.floors)[0];
 document.getElementById("app").innerHTML=header()+(S.view==="rota"?viewRota():S.view==="new"?viewNew():viewSet());
 save();
}
function logChange(entry){const f=F();(f.log=f.log||[]).push(Object.assign({at:Date.now()},entry));}
function markChanged(mon,ids){mon.changed=Array.from(new Set((mon.changed||[]).concat(ids)));}
function placeOf(mon,s){return label(mon.cols[lay(mon.cols).sc[s]]);}

document.addEventListener("click",e=>{
 const b=e.target.closest("[data-act]");if(!b||b.disabled)return;const a=b.dataset.act,v=b.dataset.v,f=F();
 const mon=f.months[S.key];
 if(a==="lang")S.lang=v;
 else if(a==="view"){S.view=v;U.confirm=null;}
 else if(a==="pick")U.sel={d:+b.dataset.d,s:+b.dataset.s};
 else if(a==="swap"&&U.sel){const {d,s}=U.sel,d2=+b.dataset.d2,s2=+b.dataset.s2,A=mon.days[d][s],B=mon.days[d2][s2];
   mon.days[d][s]=B;mon.days[d2][s2]=A;markChanged(mon,[d+"-"+s,d2+"-"+s2]);
   logChange({k:S.key,kind:"swap",a:A,b:B,d1:d,p1:placeOf(mon,s),d2,p2:placeOf(mon,s2)});U.sel=null;render();toast(t("swapDone",{a:A,b:B}));return;}
 else if(a==="take"&&U.sel){const {d,s}=U.sel,A=mon.days[d][s],B=document.getElementById("takesel").value;
   mon.days[d][s]=B;markChanged(mon,[d+"-"+s]);logChange({k:S.key,kind:"take",a:A,b:B,d1:d,p1:placeOf(mon,s)});U.sel=null;render();toast(t("takeDone",{a:A,b:B}));return;}
 else if(a==="set"&&U.sel){const {d,s}=U.sel,A=mon.days[d][s],B=document.getElementById("setsel").value;
   if(A!==B){mon.days[d][s]=B;markChanged(mon,[d+"-"+s]);logChange({k:S.key,kind:"set",a:A,b:B,d1:d,p1:placeOf(mon,s)});}U.sel=null;render();toast(t("setDone"));return;}
 else if(a==="exWord")exWord(S.key,mon);
 else if(a==="exExcel")exExcel(S.key,mon);
 else if(a==="exPrint"){exPrint(S.key,mon);return;}
 else if(a==="exWa"){copyText(waText(S.key,mon));return;}
 else if(a==="gen"){if(U.gen&&U.gen.k===U.newKey)U.seed++;generate(U.newKey);U.confirm=null;}
 else if(a==="askreplace")U.confirm="replace";
 else if(a==="cancel")U.confirm=null;
 else if(a==="savemonth"){const g=U.gen;f.months[g.k]=g.mon;S.key=g.k;S.view="rota";U.gen=null;U.confirm=null;U.newKey=null;render();toast(t("saved",{month:monthName(g.k)}));return;}
 else if(a==="never"){const r=f.rooms[+b.dataset.i],j=+v;r.never=(r.never||[]).includes(j)?r.never.filter(x=>x!==j):[...(r.never||[]),j];U.gen=null;}
 else if(a==="deldate"){const r=f.rooms[+b.dataset.i];r.dates=(r.dates||[]).filter(x=>x!==v);U.gen=null;}
 else if(a==="delroom"){f.rooms.splice(+b.dataset.i,1);U.gen=null;}
 else if(a==="addroom")f.rooms.push({u:"",g:"",never:[],dates:[]});
 else if(a==="bulkadd"){let n=0;(document.getElementById("bulk").value||"").split(/\r?\n/).map(x=>x.trim()).filter(Boolean).forEach(l=>{const p=l.split(/[\s;,\t]+/);if(!p[0]||f.rooms.some(r=>r.u===p[0]))return;f.rooms.push({u:p[0],g:p[1]||"",never:[],dates:[]});n++;});U.gen=null;render();toast(t("bulkDone",{n}));return;}
 else if(a==="delplace"){f.places.splice(+b.dataset.i,1);U.gen=null;}
 else if(a==="addplace")f.places.push({nl:"",en:"",n:1,g:"alle"});
 else if(a==="addfloor"){const n=(document.getElementById("newfloor").value||"").trim();if(!n)return;if(S.floors[n]){toast(t("floorExists"));return;}
   const first=S.floors[Object.keys(S.floors)[0]];S.floors[n]=freshFloor();S.floors[n].places=first.places.map(p=>({...p}));S.floor=n;U.sel=null;U.gen=null;}
 else if(a==="askdelfloor")U.confirm="delfloor";
 else if(a==="delfloor"){delete S.floors[S.floor];S.floor=Object.keys(S.floors)[0];U.confirm=null;U.sel=null;U.gen=null;}
 else if(a==="backup"){S.lastBackup=Date.now();save();download(`schoonmaakrooster-backup-${new Date().toISOString().slice(0,10)}.json`,"application/json",JSON.stringify(S,null,1));render();toast(t("backupSaved"));return;}
 else if(a==="restore"){document.getElementById("restore").click();return;}
 render();
});
document.addEventListener("input",e=>{const el=e.target,f=F();
 if(el.dataset.pl){const [i,k]=el.dataset.pl.split(":");f.places[+i][k]=k==="n"?+el.value:el.value;U.gen=null;save();}
 else if(el.dataset.rm){const [i,k]=el.dataset.rm.split(":");f.rooms[+i][k]=el.value.trim();U.gen=null;save();}
 else if(el.id==="loc"){S.location=el.value;save();}
});
document.addEventListener("change",e=>{const el=e.target,f=F();
 if(el.id==="floorsel"){S.floor=el.value;U.sel=null;U.gen=null;U.newKey=null;U.confirm=null;render();}
 else if(el.id==="monthsel"){S.key=el.value;U.sel=null;render();}
 else if(el.id==="newmonth"){if(el.value){U.newKey=el.value;U.gen=null;U.confirm=null;render();}}
 else if(el.dataset.adddate!==undefined&&el.value){const r=f.rooms[+el.dataset.adddate];r.dates=Array.from(new Set([...(r.dates||[]),el.value]));U.gen=null;render();}
 else if(el.dataset.pl||el.dataset.rm){render();}
 else if(el.id==="restore"&&el.files[0]){const rd=new FileReader();rd.onload=()=>{try{const x=JSON.parse(rd.result);if(!x||!x.floors)throw 0;S=x;U.sel=null;U.gen=null;render();toast(t("restored"));}catch(_){toast(t("restoreFail"));}el.value="";};rd.readAsText(el.files[0]);}
});
render();
})();
</script>
</body>
</html>
